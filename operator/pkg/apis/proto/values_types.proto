syntax = 'proto3';

package dubbo.operator.v1alpha1;

import "google/protobuf/wrappers.proto";

// Package-wide variables from generator "generated".
option go_package = "dubbo.apache.org/dubbo/operator/pkg/apis";

message ManagementConfig {
  int64 port = 1;
}

message ActivationConfig {
  // gRPC port serving KEDA's external scaler contract. Zero disables it.
  //
  // Wrapped so an explicit 0 is distinguishable from an unset field: a bare
  // int64 drops its zero value, which would make the off switch unreachable
  // through the operator API.
  google.protobuf.Int64Value port = 1;
}

message ProxyConfig {
  string clusterDomain = 1;
}

message GatewayConfig {
  // Default replica count for managed dxgate deployments. Individual Gateways
  // override it with the gateway.dubbo.apache.org/replicas annotation.
  google.protobuf.Int32Value replicaCount = 1;
}

message GlobalConfig {
  ProxyConfig proxy = 1;

  int64 statusPort = 2;

  ManagementConfig management = 3;

  bool configValidation = 4;

  MulticlusterConfig multicluster = 5;

  reserved 6;

  GatewayConfig gateway = 7;

  // Field numbers are part of the wire format, so two branches must never
  // claim the same one: 7 already belongs to gateway, and reusing it would
  // produce a proto that compiles while silently reinterpreting data.
  ActivationConfig activation = 8;
}

message RemoteAccessConfig {
  bool enabled = 1;

  string serviceType = 2;

  int64 xdsPort = 3;

  int64 webhookPort = 4;

  repeated string certificateHosts = 5;

  int64 grpcPort = 6;
}

message EastWestGatewayEndpoint {
  string clusterName = 1;

  string address = 2;

  int64 port = 3;
}

message EastWestGatewayConfig {
  bool enabled = 1;

  string serviceType = 2;

  int64 port = 3;

  int64 targetPort = 4;

  int64 nodePort = 5;

  repeated EastWestGatewayEndpoint gateways = 6;

  string xdsAddress = 7;
}

message MulticlusterConfig {
  RemoteAccessConfig remoteAccess = 1;

  EastWestGatewayConfig eastWestGateway = 2;
}

message Values {
  // Global configuration for dubbo components.
  GlobalConfig global = 1;

  // Revision for rendered control plane resources.
  string revision = 2;

  // Number of dubbod replicas. Two by default; a PodDisruptionBudget and
  // topology spread are added automatically above one. Wrapped so an explicit
  // 1 is distinguishable from an unset field.
  google.protobuf.Int32Value replicaCount = 3;

  // Control-plane image used by dubbod and its admission webhook.
  string image = 4;
}

// IntOrString is a type that can hold an int32 or a string.  When used in
// JSON or YAML marshalling and unmarshalling, it produces or consumes the
// inner type.  This allows you to have, for example, a JSON field that can
// accept a name or number.
// TODO: Rename to Int32OrString
//
// +protobuf=true
// +protobuf.options.(gogoproto.goproto_stringer)=false
// +k8s:openapi-gen=true
message IntOrString {
  int64 type = 1;

  google.protobuf.Int32Value intVal = 2;

  google.protobuf.StringValue strVal = 3;
}
