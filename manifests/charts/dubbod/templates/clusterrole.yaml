apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dubbod-clusterrole-dubbo-system
rules:
  - apiGroups: [ "security.dubbo.apache.org" ]
    verbs: [ "get", "watch", "list" ]
    resources: [ "*" ]
  - apiGroups: [ "networking.dubbo.apache.org" ]
    verbs: [ "get", "watch", "list" ]
    resources: [ "*" ]
  # The activation controller publishes readiness back onto the policy. Without
  # the status subresource the conditions are computed and then silently
  # dropped, leaving an operator with no way to tell a working policy from a
  # broken one.
  - apiGroups: [ "networking.dubbo.apache.org" ]
    verbs: [ "get", "update", "patch" ]
    resources: [ "serviceactivationpolicies/status" ]
  - apiGroups: [ "telemetry.dubbo.apache.org" ]
    verbs: [ "get", "watch", "list" ]
    resources: [ "*" ]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: [ "services/status" ]
    verbs: [ "get", "watch", "list", "update", "patch", "create", "delete" ]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "namespaces", "endpoints"]
    verbs: ["get", "list", "watch"]
  # The management API tails control plane and managed gateway pods; `pods`
  # alone does not cover the log subresource.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "watch", "list", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "watch", "update"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # ServiceActivationPolicy status follows the referenced KEDA object. This is
  # read-only and optional: the delayed informer remains dormant when KEDA is
  # not installed.
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - gatewayclasses
      - httproutes
      - backendtlspolicies
      - referencegrants
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses/status
      - gateways/status
      - httproutes/status
    verbs:
      - update
      - patch
  - apiGroups: [""]
    resources:
      - serviceaccounts
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # The gateway controller renders a PodDisruptionBudget alongside each
  # multi-replica dxgate Deployment. Without this the budget is generated but
  # never applied, and the apply failure is the only symptom.
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
