{{- $defaults := .Values._internal_default_values_not_set | default dict }}
{{- $defaultManagement := $defaults.management | default dict }}
{{- $management := .Values.management | default dict }}
{{- $managementPort := int (coalesce $management.port $defaultManagement.port 26080) }}
{{- $replicaCount := int (coalesce .Values.replicaCount $defaults.replicaCount 1) }}
{{- $gateway := .Values.gateway | default dict }}
{{- $defaultGateway := $defaults.gateway | default dict }}
{{- $gatewayImage := coalesce $gateway.image $defaultGateway.image "dubml/transit:0.1.0" }}
{{- $gatewayReplicas := int (coalesce $gateway.replicaCount $defaultGateway.replicaCount 2) }}
{{- $image := coalesce .Values.image $defaults.image (printf "dubml/dubbod:%s" .Chart.AppVersion) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dubbod
  namespace: dubbo-system
  labels:
    app: dubbod
    dubbo.apache.org/rev: default
spec:
  replicas: {{ $replicaCount }}
  selector:
    matchLabels:
      app: dubbod
  template:
    metadata:
      labels:
        app: dubbod
    spec:
      serviceAccountName: dubbod
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: dubbod
{{- if gt $replicaCount 1 }}
      # ScheduleAnyway keeps the spread advisory: a single-node or single-zone
      # cluster still schedules every replica instead of leaving the control
      # plane one pod short.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dubbod
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dubbod
{{- end }}
      containers:
        - name: execute
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - "execute"
            - --domain
            - cluster.local
            - --managementAddr
            - ":{{ $managementPort }}"
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http-debug
            - containerPort: {{ $managementPort }}
              protocol: TCP
              name: management
            - containerPort: 26010
              protocol: TCP
              name: grpc-xds
            - containerPort: 26012
              protocol: TCP
              name: tls-xds
            - containerPort: 26017
              protocol: TCP
              name: https-webhooks
          env:
            - name: REVISION
              value: default
            - name: DUBBO_CERT_PROVIDER
              value: dubbod
            - name: DUBBO_TRANSIT_IMAGE
              value: {{ $gatewayImage | quote }}
            - name: DUBBO_TRANSIT_REPLICAS
              value: {{ $gatewayReplicas | quote }}
            - name: CLUSTER_ID
              value: "Kubernetes"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.serviceAccountName
          resources:
            requests:
              cpu: 500m
              memory: 2048Mi
          volumeMounts:
          - mountPath: /var/run/secrets/dubbod/ca
            name: dubbo-csr-ca-configmap
            readOnly: true
      volumes:
      - configMap:
          defaultMode: 420
          name: dubbo-ca-root-cert
          optional: true
        name: dubbo-csr-ca-configmap
