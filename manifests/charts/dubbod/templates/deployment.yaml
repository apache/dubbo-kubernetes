{{- $defaults := .Values._internal_default_values_not_set | default dict }}
{{- $defaultManagement := $defaults.management | default dict }}
{{- $defaultMulticluster := $defaults.multicluster | default dict }}
{{- $defaultRemoteAccess := $defaultMulticluster.remoteAccess | default dict }}
{{- $defaultEastWestGateway := $defaultMulticluster.eastWestGateway | default dict }}
{{- $management := .Values.management | default dict }}
{{- $multicluster := .Values.multicluster | default dict }}
{{- $remoteAccess := $multicluster.remoteAccess | default dict }}
{{- $eastWestGateway := $multicluster.eastWestGateway | default dict }}
{{- $managementPort := int (coalesce $management.port $defaultManagement.port 26080) }}
{{- $defaultActivation := $defaults.activation | default dict }}
{{- $activation := .Values.activation | default dict }}
{{- /* coalesce skips zero, so an explicit 0 has to be read with hasKey or the off switch silently falls back to the default. */ -}}
{{- $activationPort := int (coalesce $defaultActivation.port 26030) }}
{{- if hasKey $activation "port" }}
{{- $activationPort = int $activation.port }}
{{- end }}
{{- $replicaCount := int (coalesce .Values.replicaCount $defaults.replicaCount 1) }}
{{- $gateway := .Values.gateway | default dict }}
{{- $defaultGateway := $defaults.gateway | default dict }}
{{- $gatewayImage := coalesce $gateway.image $defaultGateway.image "kdubbo/dxgate:latest" }}
{{- $gatewayReplicas := int (coalesce $gateway.replicaCount $defaultGateway.replicaCount 2) }}
{{- $defaultSecurity := $defaults.security | default dict }}
{{- $defaultCA := $defaultSecurity.ca | default dict }}
{{- $defaultPluginCA := $defaultCA.plugin | default dict }}
{{- $defaultKubernetesCA := $defaultCA.kubernetes | default dict }}
{{- $security := .Values.security | default dict }}
{{- $ca := $security.ca | default dict }}
{{- $pluginCA := $ca.plugin | default dict }}
{{- $kubernetesCA := $ca.kubernetes | default dict }}
{{- $caProvider := coalesce $ca.provider $defaultCA.provider "builtin" }}
{{- $pluginCASecretName := coalesce $pluginCA.secretName $defaultPluginCA.secretName "cacerts" }}
{{- $kubernetesSignerName := coalesce $kubernetesCA.signerName $defaultKubernetesCA.signerName }}
{{- $kubernetesSignerDomain := coalesce $kubernetesCA.signerDomain $defaultKubernetesCA.signerDomain }}
{{- $kubernetesRootConfigMapName := coalesce $kubernetesCA.rootConfigMapName $defaultKubernetesCA.rootConfigMapName "dubbo-ca-root-cert" }}
{{- if and (eq $caProvider "kubernetes") (not $kubernetesSignerName) }}
{{- fail "security.ca.kubernetes.signerName is required when security.ca.provider=kubernetes" }}
{{- end }}
{{- if and (eq $caProvider "plugin") (not $pluginCASecretName) }}
{{- fail "security.ca.plugin.secretName is required when security.ca.provider=plugin" }}
{{- end }}
{{- $remoteAccessCertificateHosts := $remoteAccess.certificateHosts | default $defaultRemoteAccess.certificateHosts | default (list) }}
{{- $eastWestGateways := $eastWestGateway.gateways | default $defaultEastWestGateway.gateways | default (list) }}
{{- $eastWestGatewayEntries := list }}
{{- $image := coalesce .Values.image $defaults.image (printf "ghcr.io/apache/dubbo-kubernetes/dubbod:%s" .Chart.AppVersion) }}
{{- $defaultEastWestGatewayPort := int (coalesce $eastWestGateway.port $defaultEastWestGateway.port 15443) }}
{{- range $gateway := $eastWestGateways }}
{{- $gatewayPort := int (coalesce $gateway.port $defaultEastWestGatewayPort) }}
{{- $eastWestGatewayEntries = append $eastWestGatewayEntries (printf "%s=%s:%d" $gateway.clusterName $gateway.address $gatewayPort) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dubbod
  namespace: dubbo-system
  labels:
    app: dubbod
    dubbo.apache.org/rev: default
spec:
  replicas: {{ $replicaCount }}
  selector:
    matchLabels:
      app: dubbod
  template:
    metadata:
      labels:
        app: dubbod
    spec:
      serviceAccountName: dubbod
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: dubbod
{{- if gt $replicaCount 1 }}
      # ScheduleAnyway keeps the spread advisory: a single-node or single-zone
      # cluster still schedules every replica instead of leaving the control
      # plane one pod short.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dubbod
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dubbod
{{- end }}
      containers:
        - name: execute
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - "execute"
            - --domain
            - cluster.local
            - --managementAddr
            - ":{{ $managementPort }}"
{{- if gt $activationPort 0 }}
            - --activationAddr
            - ":{{ $activationPort }}"
{{- else }}
            # Port 0 turns the KEDA scaler off; an empty address is how dubbod
            # skips the listener entirely.
            - --activationAddr
            - ""
{{- end }}
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http-debug
            - containerPort: {{ $managementPort }}
              protocol: TCP
              name: management
{{- if gt $activationPort 0 }}
            - containerPort: {{ $activationPort }}
              protocol: TCP
              name: activation
{{- end }}
            - containerPort: 26010
              protocol: TCP
              name: grpc-xds
            - containerPort: 26012
              protocol: TCP
              name: tls-xds
            - containerPort: 26017
              protocol: TCP
              name: https-webhooks
          env:
            - name: REVISION
              value: default
            - name: DUBBO_CERT_PROVIDER
{{- if eq $caProvider "kubernetes" }}
              value: {{ printf "k8s.io/%s" $kubernetesSignerName | quote }}
{{- else }}
              value: dubbod
{{- end }}
{{- if eq $caProvider "plugin" }}
            - name: ROOT_CA_DIR
              value: /etc/cacerts
{{- end }}
{{- if eq $caProvider "kubernetes" }}
            - name: EXTERNAL_CA
              value: DUBBOD_RA_KUBERNETES_API
            - name: K8S_SIGNER
              value: {{ $kubernetesSignerName | quote }}
{{- if $kubernetesSignerDomain }}
            - name: CERT_SIGNER_DOMAIN
              value: {{ $kubernetesSignerDomain | quote }}
{{- end }}
{{- end }}
            - name: DUBBO_DXGATE_IMAGE
              value: {{ $gatewayImage | quote }}
{{- if gt (len $remoteAccessCertificateHosts) 0 }}
            - name: DUBBOD_CUSTOM_HOST
              value: {{ join "," $remoteAccessCertificateHosts | quote }}
{{- end }}
{{- if gt (len $eastWestGatewayEntries) 0 }}
            - name: DUBBO_EASTWEST_GATEWAYS
              value: {{ join "," $eastWestGatewayEntries | quote }}
{{- end }}
            - name: DUBBO_DXGATE_REPLICAS
              value: {{ $gatewayReplicas | quote }}
            - name: CLUSTER_ID
              value: "Kubernetes"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.serviceAccountName
          resources:
            requests:
              cpu: 500m
              memory: 2048Mi
          volumeMounts:
          - mountPath: /var/run/secrets/dubbod/ca
            name: dubbo-csr-ca-configmap
            readOnly: true
{{- if eq $caProvider "plugin" }}
          - mountPath: /etc/cacerts
            name: plugin-ca
            readOnly: true
{{- end }}
{{- if eq $caProvider "kubernetes" }}
          - mountPath: /etc/external-ca-cert
            name: kubernetes-ca-root
            readOnly: true
{{- end }}
      volumes:
      - configMap:
          defaultMode: 420
          name: dubbo-ca-root-cert
          optional: true
        name: dubbo-csr-ca-configmap
{{- if eq $caProvider "plugin" }}
      - name: plugin-ca
        secret:
          secretName: {{ $pluginCASecretName | quote }}
{{- end }}
{{- if eq $caProvider "kubernetes" }}
      - name: kubernetes-ca-root
        configMap:
          name: {{ $kubernetesRootConfigMapName | quote }}
          optional: false
{{- end }}
