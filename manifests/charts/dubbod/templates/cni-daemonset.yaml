{{- $defaults := .Values._internal_default_values_not_set | default dict }}
{{- $image := coalesce .Values.image $defaults.image (printf "ghcr.io/apache/dubbo-kubernetes/dubbod:%s" .Chart.AppVersion) }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dubbo-cni-node
  namespace: dubbo-system
  labels:
    app: dubbo-cni
    dubbo.apache.org/rev: default
spec:
  selector:
    matchLabels:
      app: dubbo-cni
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dubbo-cni
        dubbo.apache.org/rev: default
        inherent.dubbo.apache.org/inject: "false"
    spec:
      serviceAccountName: dubbo-cni
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - operator: Exists
      containers:
        - name: install-cni
          image: {{ $image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/dubbo-cni
          args:
            - install
            - --watch
            - --bin-dir=/opt/cni/bin
            - --conf-dir=/etc/cni/net.d
            - --state-dir=/var/run/dubbo-cni
            - --kubeconfig=/etc/cni/net.d/dubbo-cni-kubeconfig
            - --token-file=/var/run/dubbo-cni/token
            - --ca-file=/var/run/dubbo-cni/ca.crt
            - --grpc-inbound-port=15080
            - --managed-label=inherent.dubbo.apache.org/managed
            - --managed-label-value=true
            - --iptables-path=iptables
            - --ipset-path=ipset
            - --refresh-interval=1m
          lifecycle:
            preStop:
              exec:
                command:
                  - /usr/local/bin/dubbo-cni
                  - uninstall
                  - --bin-dir=/opt/cni/bin
                  - --conf-dir=/etc/cni/net.d
                  - --state-dir=/var/run/dubbo-cni
                  - --kubeconfig=/etc/cni/net.d/dubbo-cni-kubeconfig
                  - --token-file=/var/run/dubbo-cni/token
                  - --ca-file=/var/run/dubbo-cni/ca.crt
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: cni-bin-dir
              mountPath: /opt/cni/bin
            - name: cni-conf-dir
              mountPath: /etc/cni/net.d
            - name: cni-state-dir
              mountPath: /var/run/dubbo-cni
      volumes:
        - name: cni-bin-dir
          hostPath:
            path: /opt/cni/bin
            type: DirectoryOrCreate
        - name: cni-conf-dir
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: cni-state-dir
          hostPath:
            path: /var/run/dubbo-cni
            type: DirectoryOrCreate
