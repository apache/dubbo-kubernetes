{{- $defaults := .Values._internal_default_values_not_set | default dict }}
{{- $trustDomain := coalesce .Values.trustDomain $defaults.trustDomain "cluster.local" }}
{{- $revision := .Values.revision | default "default" }}
{{- $statusPort := coalesce .Values.statusPort $defaults.statusPort 26020 }}
{{- $repo := coalesce .Values.repo $defaults.repo "ghcr.io/apache/dubbo-kubernetes" }}
{{- $tag := .Chart.AppVersion }}
{{- if and (hasKey .Values "tag") (ne (.Values.tag | toString) "") }}
{{- $tag = .Values.tag }}
{{- else if and (hasKey $defaults "tag") (ne ($defaults.tag | toString) "") }}
{{- $tag = $defaults.tag }}
{{- end }}
{{- $image := coalesce .Values.image $defaults.image "dubbod" }}
{{- if not (contains "/" $image) }}
{{- $image = printf "%s/%s:%v" $repo $image $tag }}
{{- end }}
{{- $original := omit .Values "_internal_default_values_not_set" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: values
  namespace: dubbo-system
  labels:
    app: dubbod
    dubbo.apache.org/rev: {{ $revision }}
data:
  merged-values: |-
    revision: {{ $revision | quote }}
    image: {{ $image | quote }}
    trustDomain: {{ $trustDomain | quote }}
    statusPort: {{ $statusPort }}
  original-values: |-
{{ $original | toYaml | nindent 4 }}
