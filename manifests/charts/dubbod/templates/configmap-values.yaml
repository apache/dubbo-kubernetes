{{- $defaults := .Values._internal_default_values_not_set | default dict }}
{{- $defaultProxy := $defaults.proxy | default dict }}
{{- $defaultManagement := $defaults.management | default dict }}
{{- $proxy := .Values.proxy | default dict }}
{{- $management := .Values.management | default dict }}
{{- $clusterDomain := coalesce $proxy.clusterDomain $defaultProxy.clusterDomain "cluster.local" }}
{{- $revision := .Values.revision | default "default" }}
{{- $statusPort := coalesce .Values.statusPort $defaults.statusPort 26020 }}
{{- $managementPort := int (coalesce $management.port $defaultManagement.port 26080) }}
{{- $image := coalesce .Values.image $defaults.image (printf "ghcr.io/apache/dubbo-kubernetes/dubbod:%s" .Chart.AppVersion) }}
{{- $original := omit .Values "_internal_default_values_not_set" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: values
  namespace: dubbo-system
  labels:
    app: dubbod
    dubbo.apache.org/rev: {{ $revision }}
data:
  merged-values: |-
    revision: {{ $revision | quote }}
    image: {{ $image | quote }}
    proxy:
      clusterDomain: {{ $clusterDomain | quote }}
    management:
      port: {{ $managementPort }}
    statusPort: {{ $statusPort }}
  original-values: |-
{{ $original | toYaml | nindent 4 }}
