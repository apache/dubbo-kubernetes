metadata:
  annotations:
    dubbo.apache.org/rev: default
    inject.dubbo.apache.org/templates: triple-engine
spec:
  containers:
  - name: {{ if gt (len .Spec.Containers) 0 }}{{ (index .Spec.Containers 0).Name | quote }}{{ else }}app{{ end }}
    env:
    - name: TRIPLE_XDS_BOOTSTRAP
      value: /etc/dubbo/proxy/triple-bootstrap.json
    - name: DUBBO_TRIPLE_STATUS_ADDRESS
      value: "0.0.0.0:9090"
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
    - name: INSTANCE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.podIP
{{- if and (gt (len .Spec.Containers) 0) (contains "dubml/dubbod" ((index .Spec.Containers 0).Image | default "")) }}
    args:
    - triple-engine
    - --watch
{{- end }}
    volumeMounts:
    - name: dubbo-xds
      mountPath: /etc/dubbo/proxy
      readOnly: true
  volumes:
  - name: dubbo-xds
    secret:
      secretName: dubbo-xds
      defaultMode: 420
