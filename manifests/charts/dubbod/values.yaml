_internal_default_values_not_set:
  revision: ""

  # Number of dubbod replicas. Two by default: a single replica makes every
  # node drain, upgrade or eviction a full control-plane outage, during which
  # no workload can be injected and no xDS update is served. At >= 2 a
  # PodDisruptionBudget (minAvailable: 1) and topology spread are added
  # automatically. Set to 1 only for local development.
  replicaCount: 2

  # Shared image for dubbod, the injector, and the fixed CNI runtime. An empty
  # value resolves to ghcr.io/apache/dubbo-kubernetes/dubbod:<Chart.appVersion>.
  image: ""

  proxy:
    clusterDomain: "cluster.local"

  meshConfig:
    # SPIFFE trust domains accepted in addition to proxy.clusterDomain.
    trustDomainAliases: []
    # Valid values: TLSV1_2 or TLSV1_3.
    minimumTlsVersion: TLSV1_2
    # Raw MeshConfig provider and CA entries. Policies reference providers by name.
    extensionProviders: []
    caCertificates: []

  security:
    ca:
      # builtin uses the rotating Dubbod CA; plugin mounts a four-file cacerts
      # Secret; kubernetes delegates signing through the certificates.k8s.io API.
      provider: builtin
      plugin:
        secretName: cacerts
      kubernetes:
        signerName: ""
        signerDomain: ""
        rootConfigMapName: dubbo-ca-root-cert

  statusPort: 26020

  management:
    port: 26080

  gateway:
    # Image used by managed Gateway deployments. Keep it independently
    # configurable from dubbod/CNI so a gateway can be rolled independently.
    image: "kdubbo/dxgate:latest"
    # Individual Gateways can override this with the
    # gateway.dubbo.apache.org/replicas annotation.
    replicaCount: 2

  activation:
    # KEDA external scaler for on-demand activation. Set port to 0 to disable
    # it; the rest of the control plane is unaffected either way.
    port: 26030

  configValidation: true

  multicluster:
    remoteAccess:
      enabled: false
      serviceType: "LoadBalancer"
      grpcPort: 26010
      xdsPort: 26012
      webhookPort: 443
      certificateHosts: []
    eastWestGateway:
      enabled: false
      serviceType: "LoadBalancer"
      port: 15443
      targetPort: 15080
      nodePort: 0
      gateways: []
      xdsAddress: ""
