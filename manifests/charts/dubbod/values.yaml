_internal_default_values_not_set:
  revision: ""

  # Number of dubbod replicas. Two by default: a single replica makes every
  # node drain, upgrade or eviction a full control-plane outage, during which
  # no workload can be injected and no xDS update is served. At >= 2 a
  # PodDisruptionBudget (minAvailable: 1) and topology spread are added
  # automatically. Set to 1 only for local development.
  replicaCount: 2

  global:
    proxy:
      clusterDomain: "cluster.local"

    proxyless:
      cni:
        enabled: true
        # Shared control-plane/CNI image. An empty value resolves to
        # ghcr.io/apache/dubbo-kubernetes/dubbod:<Chart.appVersion>.
        image: ""
        binDir: "/opt/cni/bin"
        confDir: "/etc/cni/net.d"
        stateDir: "/var/run/dubbo-cni"
        grpcInboundPort: 15080
        managedLabel: "proxyless.dubbo.apache.org/managed"
        managedLabelValue: "true"
        iptablesPath: "iptables"
        ipsetPath: "ipset"
        refreshInterval: "1m"

    statusPort: 26020

    management:
      port: 26080

    gateway:
      # Default replica count for every managed dxgate Deployment. An
      # individual Gateway overrides it with the
      # gateway.dubbo.apache.org/replicas annotation.
      replicaCount: 2

    activation:
      # KEDA external scaler for on-demand activation. Set port to 0 to disable
      # it; the rest of the control plane is unaffected either way.
      port: 26030

    configValidation: true

    multicluster:
      remoteAccess:
        enabled: false
        serviceType: "LoadBalancer"
        grpcPort: 26010
        xdsPort: 26012
        webhookPort: 443
        certificateHosts: []
      eastWestGateway:
        enabled: false
        serviceType: "LoadBalancer"
        port: 15443
        targetPort: 15080
        nodePort: 0
        gateways: []
        xdsAddress: ""
