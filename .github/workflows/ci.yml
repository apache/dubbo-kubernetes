name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.9.0
  # Must match PROTOC_VERSION in common.mk: protoc stamps its own
  # version into every generated file, so a different one here rewrites them
  # all and make check-generate can never pass.
  PROTOC_VERSION: v33.0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'apache/dubbo-kubernetes'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Run shellcheck
        run: make lint-shell

  check:
    name: Check Repo Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'apache/dubbo-kubernetes'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Check go.mod/go.sum are tidy
        run: make check-tidy

      # Generated sources are never merged line by line (see .gitattributes);
      # they are regenerated. This proves the committed output still matches
      # what the generators produce, so a hand-edited or stale generated file
      # fails here with a diff instead of later as a compile error.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check generated sources are up to date
        run: make check-generate

      - name: Check License Header
        uses: apache/skywalking-eyes/header@v0.6.0

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'apache/dubbo-kubernetes'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build all binaries
        run: make build GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

      - name: Compile tests (vet whole tree)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go build ./...

  helm:
    name: Helm Charts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'apache/dubbo-kubernetes'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint and render charts
        run: make lint-helm

  required:
    name: CI Required
    runs-on: ubuntu-slim
    timeout-minutes: 5
    # Evaluate after all dependencies settle, but do not keep a superseded
    # workflow alive and blocking the next run in this PR's concurrency group.
    if: ${{ always() && !cancelled() }}
    needs:
      - lint
      - check
      - build
      - helm
    steps:
      - name: Verify required jobs passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          HELM_RESULT: ${{ needs.helm.result }}
        run: |
          failed=0
          for job_result in \
            "lint=${LINT_RESULT}" \
            "check=${CHECK_RESULT}" \
            "build=${BUILD_RESULT}" \
            "helm=${HELM_RESULT}"; do
            job="${job_result%%=*}"
            result="${job_result#*=}"
            echo "${job}: ${result}"
            if [[ "${result}" != "success" ]]; then
              failed=1
            fi
          done
          if [[ "${failed}" -ne 0 ]]; then
            echo "Required CI job did not succeed." >&2
            exit 1
          fi
