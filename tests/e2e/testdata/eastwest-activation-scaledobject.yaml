apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: payment
  namespace: e2e
spec:
  scaleTargetRef:
    name: payment
  minReplicaCount: 0
  maxReplicaCount: 3
  pollingInterval: 1
  cooldownPeriod: 10
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 0
  triggers:
    - type: external
      metadata:
        scalerAddress: dubbod-activation.dubbo-system.svc.cluster.local:26030
        service: payment
        namespace: e2e
        targetPendingRequests: "1"
