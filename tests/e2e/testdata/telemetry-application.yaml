apiVersion: v1
kind: Namespace
metadata:
  name: telemetry-e2e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-application
  namespace: telemetry-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-application
  namespace: telemetry-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-application
        inherent.dubbo.apache.org/inject: "true"
      annotations:
        inject.dubbo.apache.org/templates: grpc-engine
        inherent.dubbo.apache.org/excludeInboundPorts: "9090"
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: telemetry-application
      containers:
      - name: application
        image: kdubbo/activation-e2e:telemetry-r2
        imagePullPolicy: IfNotPresent
        args:
        - telemetry
        ports:
        - name: grpc
          containerPort: 8080
        - name: metrics
          containerPort: 9090
        readinessProbe:
          httpGet:
            path: /healthz
            port: metrics
          periodSeconds: 2
