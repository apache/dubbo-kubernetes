apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment
  namespace: e2e
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: e2e
spec:
  selector:
    app: payment
  ports:
    - name: grpc
      port: 8080
      targetPort: 15080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
        inherent.dubbo.apache.org/inject: "true"
      annotations:
        inject.dubbo.apache.org/templates: grpc-engine
    spec:
      serviceAccountName: payment
      containers:
        - name: payment
          image: kdubbo/activation-e2e:latest
          imagePullPolicy: IfNotPresent
          args: ["server"]
          ports:
            - name: grpc
              containerPort: 8080
---
apiVersion: networking.dubbo.apache.org/v1alpha3
kind: ServiceActivationPolicy
metadata:
  name: payment
  namespace: e2e
spec:
  targetRef:
    kind: Service
    name: payment
  autoscalerRef:
    group: keda.sh
    kind: ScaledObject
    name: payment
  backendServiceAccounts:
    - payment
  protocols:
    - HTTP
    - GRPC_UNARY
  requestTimeout: 60s
  maxPendingRequests: 100
  failurePolicy: REJECT
---
apiVersion: security.dubbo.apache.org/v1alpha3
kind: PeerAuthentication
metadata:
  name: strict
  namespace: e2e
spec:
  mtls:
    mode: STRICT
