apiVersion: v1
kind: Pod
metadata:
  name: payment-client
  namespace: e2e
  labels:
    app: payment-client
    inherent.dubbo.apache.org/inject: "true"
  annotations:
    inject.dubbo.apache.org/templates: grpc-engine
spec:
  restartPolicy: Never
  initContainers:
    - name: wait-for-bootstrap
      image: kdubbo/activation-e2e:latest
      imagePullPolicy: IfNotPresent
      args: ["sleep"]
  containers:
    - name: client
      image: kdubbo/activation-client:latest
      imagePullPolicy: IfNotPresent
      args:
        - grpc-outbound
        - "1"
        - --host
        - payment.e2e.svc.cluster.local
        - --port
        - "8080"
        - --path
        - /health
        - --wait-timeout
        - 90s
        - --request-timeout
        - 90s
