notifications:
    commits:      commits@dubbo.apache.org
    issues:       notifications@dubbo.apache.org
    pullrequests: notifications@dubbo.apache.org

github:
  homepage: "https://kdubbo.github.io"
  description: "Build a native mesh using gRPC and xDS"
  pull_requests:
    allow_auto_merge: true
  labels:
    - dubbo
    - consul
    - kubernetes
    - service-mesh
    - microservice
    - microservices
  features:
    # Enable issue management
    issues: true
    # Enable projects for project management boards
    projects: false
    # Enable wiki for documentation
    wiki: false
  protected_branches:
    master:
      required_status_checks:
        strict: true
        checks:
          # Require the concrete CI jobs directly. A separate fan-in job needs
          # another scarce ASF runner after every real check has already passed.
          - context: Lint
            app_id: 15368
          - context: Check Repo Hygiene
            app_id: 15368
          - context: Unit Tests
            app_id: 15368
          - context: Performance Scale Smoke
            app_id: 15368
          - context: Build (linux/amd64)
            app_id: 15368
          - context: Build (linux/arm64)
            app_id: 15368
          - context: Build (darwin/amd64)
            app_id: 15368
          - context: Build (darwin/arm64)
            app_id: 15368
          - context: Helm Charts
            app_id: 15368
          - context: E2E Smoke (kind)
            app_id: 15368
          # Pin every gate to the GitHub Actions App so a personal token cannot
          # forge a required result.
          - context: Maintainer Approval Gate
            app_id: 15368
