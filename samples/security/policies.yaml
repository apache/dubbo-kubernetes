apiVersion: security.dubbo.apache.org/v1alpha3
kind: PeerAuthentication
metadata:
  name: httpbin-migration
  namespace: default
spec:
  selector:
    matchLabels:
      app: httpbin
  mtls:
    mode: PERMISSIVE
---
apiVersion: security.dubbo.apache.org/v1alpha3
kind: RequestAuthentication
metadata:
  name: httpbin-jwt
  namespace: default
spec:
  selector:
    matchLabels:
      app: httpbin
  jwtRules:
    - issuer: https://issuer.example.com
      audiences:
        - httpbin
      jwksUri: https://issuer.example.com/.well-known/jwks.json
      fromCookies:
        - session
      fromHeaders:
        - name: authorization
          prefix: "Bearer "
      forwardOriginalToken: false
      outputPayloadToHeader: x-jwt-payload
      outputClaimToHeaders:
        - claim: sub
          header: x-jwt-sub
---
apiVersion: security.dubbo.apache.org/v1alpha3
kind: AuthorizationPolicy
metadata:
  name: deny-admin-from-public-networks
  namespace: default
spec:
  selector:
    matchLabels:
      app: httpbin
  action: DENY
  rules:
    - from:
        - source:
            notRemoteIpBlocks:
              - 10.0.0.0/8
      to:
        - operation:
            paths:
              - /admin*
---
apiVersion: security.dubbo.apache.org/v1alpha3
kind: AuthorizationPolicy
metadata:
  name: allow-authenticated
  namespace: default
spec:
  selector:
    matchLabels:
      app: httpbin
  action: ALLOW
  rules:
    - from:
        - source:
            requestPrincipals:
              - https://issuer.example.com/*
      to:
        - operation:
            methods:
              - GET
              - POST
---
apiVersion: security.dubbo.apache.org/v1alpha3
kind: AuthorizationPolicy
metadata:
  name: audit-sensitive-paths
  namespace: default
spec:
  selector:
    matchLabels:
      app: httpbin
  action: AUDIT
  rules:
    - to:
        - operation:
            paths:
              - /headers*
---
apiVersion: security.dubbo.apache.org/v1alpha3
kind: AuthorizationPolicy
metadata:
  name: external-opa
  namespace: default
spec:
  selector:
    matchLabels:
      app: httpbin
  action: CUSTOM
  provider:
    name: opa
  rules:
    - to:
        - operation:
            paths:
              - /protected*
